<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rueda Nocturna: recorridos guiados en bicicleta por Medellín de noche, de jueves a sábado a las 7:30 p. m.">
  <title>Rueda Nocturna | Rueda Libre</title>

  <!-- Play CDN de Tailwind CSS: solo para prototipar, no para producción -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100">

  <!-- Sección principal de la campaña -->
  <main>
    <section class="mx-auto max-w-3xl space-y-6 px-6 py-20 sm:py-28">

      <!-- Etiqueta de campaña -->
      <p class="inline-block bg-amber-400 px-3 py-1 text-sm font-semibold tracking-wide text-slate-950">
        Nuevo · Jueves a sábado
      </p>

      <!-- Único título principal de la página -->
      <h1 class="text-5xl font-bold leading-none tracking-tight text-white sm:text-7xl">
        Rueda Nocturna
      </h1>

      <!-- Subtítulo -->
      <p class="max-w-xl text-lg leading-relaxed text-slate-300">
        Descubre Medellín en bici cuando se encienden las luces
      </p>

      <!-- Datos destacados -->
      <dl class="flex gap-10 py-4">
        <div class="space-y-1">
          <dt class="text-sm font-semibold uppercase tracking-widest text-slate-400">Recorridos</dt>
          <dd class="text-3xl font-bold text-amber-400">3 rutas</dd>
        </div>
        <div class="space-y-1">
          <dt class="text-sm font-semibold uppercase tracking-widest text-slate-400">Precio</dt>
          <dd class="text-3xl font-bold text-amber-400">Desde $55.000</dd>
        </div>
      </dl>

      <!-- Enlace con apariencia de botón -->
      <a href="../paginas/reservas.html"
        class="inline-block w-full bg-amber-400 px-8 py-3 text-center text-base font-bold text-slate-950 sm:w-auto">
        Inscríbete
      </a>

    </section>
  </main>

</body>

</html>
