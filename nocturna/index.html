<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rueda Nocturna: recorridos guiados en bicicleta por Medellín de noche, de jueves a sábado a las 7:30 p. m.">
  <title>Rueda Nocturna | Rueda Libre</title>

  <!-- CSS generado por la CLI de Tailwind (ya no se usa el Play CDN) -->
  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-950 text-slate-100">

  <main>
    <section class="mx-auto max-w-3xl space-y-6 px-6 py-20 sm:py-28">

      <p class="inline-block bg-amber-400 px-3 py-1 text-sm font-semibold tracking-wide text-slate-950">
        Nuevo · Jueves a sábado
      </p>

      <h1 class="text-5xl font-bold leading-none tracking-tight text-white sm:text-7xl">
        Rueda Nocturna
      </h1>

      <p class="max-w-xl text-lg leading-relaxed text-slate-300">
        Descubre Medellín en bici cuando se encienden las luces
      </p>

      <dl class="flex gap-10 py-4">
        <div class="space-y-1">
          <dt class="text-sm font-semibold uppercase tracking-widest text-slate-400">Recorridos</dt>
          <dd class="text-3xl font-bold text-amber-400">3 rutas</dd>
        </div>
        <div class="space-y-1">
          <dt class="text-sm font-semibold uppercase tracking-widest text-slate-400">Precio</dt>
          <dd class="text-3xl font-bold text-amber-400">Desde $55.000</dd>
        </div>
      </dl>

      <!-- Variantes de botón: principal, secundario y de contorno -->
      <div class="flex flex-col gap-4 sm:flex-row">

        <!-- Principal -->
        <a href="../paginas/reservas.html"
          class="rounded-lg bg-amber-400 px-8 py-3 text-center font-bold text-slate-950 shadow-lg hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-950">
          Inscríbete
        </a>

        <!-- Secundario -->
        <a href="#rutas"
          class="rounded-lg bg-slate-700 px-8 py-3 text-center font-bold text-white shadow-lg hover:bg-slate-600 focus:outline-none focus:ring-4 focus:ring-slate-400 focus:ring-offset-2 focus:ring-offset-slate-950">
          Ver rutas
        </a>

        <!-- Contorno -->
        <a href="../paginas/tarifas.html"
          class="rounded-lg border-2 border-amber-400 px-8 py-3 text-center font-bold text-amber-400 hover:bg-amber-400 hover:text-slate-950 focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-950">
          Ver tarifas
        </a>

      </div>

    </section>
  </main>

</body>

</html>
